name: GTA 6 Auto Clipper Bot

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

jobs:
  run-bot:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Install Python Libraries
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install --no-cache-dir google-api-python-client google-auth-oauthlib google-genai pillow yt-dlp numpy decorator proglog imageio imageio-ffmpeg pycryptodomex PySocks "curl_cffi>=0.15.0"
          python -m pip install --no-cache-dir --no-build-isolation --no-deps instagrapi
          python -m pip install --no-cache-dir --no-build-isolation --no-deps "moviepy==2.2.1"

      - name: Load Secrets
        env:
          YT_TOKEN: ${{ secrets.YT_TOKEN }}
          INSTA_SESSION: ${{ secrets.INSTA_SESSION }}
          YT_COOKIES: ${{ secrets.YT_COOKIES }}
        run: |
          echo "$YT_TOKEN" > token.json
          echo "$INSTA_SESSION" > insta_session.json
          echo "$YT_COOKIES" > cookies.txt

      - name: Run Bot
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python main.py
